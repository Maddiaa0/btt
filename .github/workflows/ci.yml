name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Pack release versions
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: cargo run --locked --example check_pack_releases -- --base "$BASE_SHA"
      - name: Test
        run: cargo test --locked
      - name: Clippy (pedantic, no warnings)
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Package crate
        run: cargo package --locked
      - name: BTT self-check
        run: cargo run --locked -- check
      - name: Fetch pinned wasm grammars
        run: ./scripts/fetch-wasm-grammars.sh
      - name: Test (wasm grammars)
        run: cargo test --locked --features wasm
      - name: Clippy (wasm, no warnings)
        run: cargo clippy --locked --all-targets --features wasm -- -D warnings
