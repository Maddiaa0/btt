name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

env:
  CARGO_TERM_COLOR: always

jobs:
  btt-action:
    name: BTT action
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check trees with the released btt binary
        uses: Maddiaa0/btt-action@b8a91c010a6b32a1fc567eec3f303a7dfe276642
        with:
          version: '0.2.0'
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Pack release versions
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: cargo run --locked --example check_pack_releases -- --base "$BASE_SHA"
      - name: Test
        run: cargo test --locked
      - name: Clippy (pedantic, no warnings)
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Package crate
        run: cargo package --locked
      - name: BTT self-check
        run: cargo run --locked -- check
      - name: Fetch pinned wasm grammars
        run: ./scripts/fetch-wasm-grammars.sh
      - name: Test (wasm grammars)
        run: cargo test --locked --features wasm
      - name: Clippy (wasm, no warnings)
        run: cargo clippy --locked --all-targets --features wasm -- -D warnings
