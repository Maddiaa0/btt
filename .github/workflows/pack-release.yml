name: Pack release

on:
  push:
    tags:
      - "pack/*/v*"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Validate tag and manifest
        run: cargo run --locked --example check_pack_releases -- --tag "$GITHUB_REF_NAME"
      - name: Format
        run: cargo fmt --all -- --check
      - name: Test
        run: cargo test --locked
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Fetch pinned wasm grammars
        run: ./scripts/fetch-wasm-grammars.sh
      - name: Test (wasm grammars)
        run: cargo test --locked --features wasm
      - name: Clippy (wasm, no warnings)
        run: cargo clippy --locked --all-targets --features wasm -- -D warnings
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
