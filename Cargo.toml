[package]
name = "btt-cli"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Branch tree testing for any language: check and scaffold test suites from bulloak-style .tree specs"
authors = ["Maddiaa0"]
documentation = "https://docs.rs/btt-cli"
homepage = "https://github.com/Maddiaa0/btt"
repository = "https://github.com/Maddiaa0/btt"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["testing", "bulloak", "btt", "tree-sitter", "scaffold"]
categories = ["development-tools::testing", "command-line-utilities"]
publish = ["crates-io"]
exclude = ["/web"]

[lib]
name = "btt"
path = "src/lib.rs"

[[bin]]
name = "btt"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
include_dir = "0.7.4"
minijinja = "2.23.0"
rayon = "1.12.0"
regex = "1.13.1"
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "2.0.20"
toml = "1.1.4"
tree-sitter = "0.26.12"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
walkdir = "2.5.0"

[profile.release]
strip = true
lto = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
# The README (included as crate docs) shows a scaffolded #[test] skeleton on purpose.
test_attr_in_doctest = "allow"

[features]
default = []
wasm = ["tree-sitter/wasm"]

[[bench]]
name = "check"
harness = false

[dev-dependencies]
criterion = "0.7.0"
