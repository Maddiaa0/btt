[package]
name = "btt"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
include_dir = "0.7.4"
minijinja = "2.23.0"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"
tree-sitter = "0.26.12"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
walkdir = "2.5.0"

[profile.release]
strip = true
lto = true
