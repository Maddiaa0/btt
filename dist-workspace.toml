[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "npm", "homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "aarch64-unknown-linux-musl", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
# Build official binaries with support for external WASM grammar packs
features = ["wasm"]
# A GitHub repo to push Homebrew formulas to
tap = "Maddiaa0/homebrew-tap"
# Keep the public Homebrew package name aligned with the executable
formula = "btt"
# A namespace to use when publishing this package to the npm registry
npm-scope = "@maddiaa0"
# Keep the public npm package name aligned with the executable
npm-package = "btt"
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Publish jobs to run in CI
publish-jobs = ["homebrew", "npm", "./publish-crates"]
# Whether to install an updater program
install-updater = false
# Generate build-provenance attestations for release artifacts
github-attestations = true
# Validate the release plan on pull requests without building every target
pr-run-mode = "plan"

[dist.github-custom-job-permissions]
publish-crates = { contents = "read" }
