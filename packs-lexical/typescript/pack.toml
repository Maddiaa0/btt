# Lexical twin of the builtin typescript pack: no grammar, no blob — the
# [lexical] profile below is the entire language definition. Validated by
# tests/lexical.rs, which differentially fuzzes it against the native
# tree-sitter extraction.

format = 1

[pack]
name = "typescript-lexical"
version = "0.2.0"
description = "TypeScript/JavaScript tests via lexical scanning (no grammar): describe blocks for branches, it/test for leaves"

[compat]
btt = ">=0.2.0"

[detect]
targets = [
  "{stem}.test.ts",
  "{stem}.spec.ts",
  "{stem}.test.mts",
  "{stem}.test.js",
  "{stem}.spec.js",
]

[grammar]
source = "lexical"

[extract]
name_syntax = "js-string"

[lexical]
line_comment = "//"
block_comment = ["/*", "*/"]
strings = [
  { delim = '"', escape = '\' },
  { delim = "'", escape = '\' },
  { delim = "`", escape = '\' },
]
nest = [["(", ")"], ["{", "}"]]

# Openers mirror the native pack's queries/tests.scm patterns. The title
# capture includes its quotes; name_syntax = "js-string" decodes it — the
# same decoder the tree-sitter path uses. The trailing [,)] rejects
# non-literal titles ("a" + x), which the native query's first-argument
# anchor also rejects.
#
# The alias patterns mirror the native query's @block.alias / @test.alias
# declarations (`const describeDb = flag ? describe : describe.skip`):
# names they discover are substituted into the {{block_aliases}} /
# {{test_aliases}} placeholders — including into the alias patterns
# themselves, so aliases of aliases resolve. They approximate the native
# shapes line-locally: the declaration keyword, name, `=`, and the
# ternary's condition must share a line, and comments inside the aliased
# expression are not tolerated.
[lexical.block]
open = '''(?:^|[^\w$.])(?<kw>(?:describe|suite|{{block_aliases}})(?:\.\w+)?|(?:it|test)\.describe)\s*\(\s*(?<name>"(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')\s*[,)]'''
alias = [
  '''(?:^|[^\w$.])(?:const|let|var)\s+(?<name>[A-Za-z_$][\w$]*)(?:\s*:[^=;\n]+)?\s*=\s*(?<src>(?:describe|suite|{{block_aliases}})(?:\s*\.\s*\w+)?|(?:it|test)\s*\.\s*describe)\s*[;,\n]''',
  '''(?:^|[^\w$.])(?:const|let|var)\s+(?<name>[A-Za-z_$][\w$]*)(?:\s*:[^=;\n]+)?\s*=[^;?:{}\n]*\?\s*(?<src>(?:describe|suite|{{block_aliases}})(?:\s*\.\s*\w+)?)\s*:\s*(?:describe|suite|{{block_aliases}})(?:\s*\.\s*\w+)?\s*[;,\n]''',
]

[lexical.test]
open = '''(?:^|[^\w$.])(?<kw>(?:it|test|{{test_aliases}})(?:\.(?:only|skip|fails|todo|fixme|slow|concurrent|sequential))?)\s*\(\s*(?<name>"(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')\s*[,)]'''
alias = [
  '''(?:^|[^\w$.])(?:const|let|var)\s+(?<name>[A-Za-z_$][\w$]*)(?:\s*:[^=;\n]+)?\s*=\s*(?<src>(?:it|test|{{test_aliases}})(?:\s*\.\s*(?:only|skip|fails|todo|fixme|slow|concurrent|sequential))?)\s*[;,\n]''',
  '''(?:^|[^\w$.])(?:const|let|var)\s+(?<name>[A-Za-z_$][\w$]*)(?:\s*:[^=;\n]+)?\s*=[^;?:{}\n]*\?\s*(?<src>(?:it|test|{{test_aliases}})(?:\s*\.\s*(?:only|skip|fails|todo|fixme|slow|concurrent|sequential))?)\s*:\s*(?:it|test|{{test_aliases}})(?:\s*\.\s*(?:only|skip|fails|todo|fixme|slow|concurrent|sequential))?\s*[;,\n]''',
]

[mapping]
# The tree root must appear as a top-level describe block.
root = "block"

[mapping.block]
case = "verbatim"

[mapping.test]
strip_prefix = "it "
case = "verbatim"

[scaffold]
template = "templates/test.jinja"
output = "{stem}.test.ts"
indent = "  "
